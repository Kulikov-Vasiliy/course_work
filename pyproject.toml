[project]
name = "course-work"
version = "0.1.0"
description = "python course_work"
authors = [
    {name = "Василий",email = "kulikov821999@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
mypy = "^1.18.2"
flake8 = "^7.3.0"


[tool.poetry.group.tool.dependencies]
black = "^25.9.0"
isort = "^6.1.0"



[flake8]
max-line-length = 119
exclude = ".*\\.git.*, .*\\__pycache__.*"


[isort]
max-line_length = 119


[tool.isort]
profile = "black"

[black]
max-line-length = 119
exclude = ".*\\.git.*"


[mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ".*\\venv.*"
